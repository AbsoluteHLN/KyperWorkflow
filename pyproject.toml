[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kyper-workflow"
version = "0.2.0"
requires-python = ">=3.11"
description = "KyperWorkflow: explicit specification approval, bounded review and project mapping"
[project.scripts]
kyper-workflow = "kyper_workflow.cli:main"
[tool.setuptools.packages.find]
include = ["kyper_workflow*", "completion_plugin*"]
[project.optional-dependencies]
mcp = ["mcp>=1.29,<2"]
